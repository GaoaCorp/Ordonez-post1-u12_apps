name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "✓ Verificando estructura del proyecto..."
          test -f settings.gradle.kts && echo "✓ settings.gradle.kts OK"
          test -f gradle/libs.versions.toml && echo "✓ Version Catalog OK"
          test -f app/build.gradle.kts && echo "✓ :app module OK"
          test -d core/domain && echo "✓ :core:domain OK"
          test -d core/data && echo "✓ :core:data OK"
          test -d core/ui && echo "✓ :core:ui OK"
          test -d feature && echo "✓ :feature modules OK"
          test -f docs/adr/ADR-001-stack-tecnologico.md && echo "✓ ADR-001 OK"
          test -f docs/adr/ADR-002-arquitectura-modulos.md && echo "✓ ADR-002 OK"
          test -f docs/adr/ADR-003-persistencia-sincronizacion.md && echo "✓ ADR-003 OK"
          echo "✓ Estructura del proyecto validada"

      - name: Validate Version Catalog
        run: |
          echo "✓ Verificando Version Catalog..."
          grep -q "agp" gradle/libs.versions.toml && echo "✓ AGP version definida"
          grep -q "kotlin" gradle/libs.versions.toml && echo "✓ Kotlin version definida"
          grep -q "compose-bom" gradle/libs.versions.toml && echo "✓ Compose BOM definida"
          grep -q "hilt" gradle/libs.versions.toml && echo "✓ Hilt version definida"
          grep -q "room" gradle/libs.versions.toml && echo "✓ Room version definida"
          echo "✓ Version Catalog completo"

      - name: Validate Kotlin source files
        run: |
          echo "✓ Buscando archivos Kotlin..."
          KT_FILES=$(find . -name "*.kt" -not -path "*/build/*" | wc -l)
          echo "Total archivos Kotlin: $KT_FILES"
          test $KT_FILES -gt 15 && echo "✓ Cantidad suficiente de archivos Kotlin"

      - name: Validate Prototype
        run: |
          echo "✓ Verificando prototipo navegable..."
          test -f prototype/index.html && echo "✓ Index del prototipo OK"
          test -f prototype/design-system.html && echo "✓ Design System OK"
          SCREENS=$(ls prototype/screen-*.html 2>/dev/null | wc -l)
          test $SCREENS -ge 5 && echo "✓ $SCREENS pantallas del flujo principal"
          echo "✓ Prototipo validado"

      - name: Summary
        run: |
          echo "════════════════════════════════════════"
          echo "  TaskFlow Post-1 — Validación PASSED"
          echo "════════════════════════════════════════"
          echo "  ✓ Estructura del proyecto"
          echo "  ✓ 3 ADRs presentes"
          echo "  ✓ Version Catalog configurado"
          echo "  ✓ Prototipo navegable (5 pantallas + DS)"
          echo "════════════════════════════════════════"
